<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#fff2f7"><title>ゆうら育成ゲーム｜ベビ期</title><link rel="stylesheet" href="style.css"><script src="script.js" defer></script></head>
<body><div class="app"><header><a class="brand" href="index.html" aria-label="最初から起動">ゆうら<span>♡</span><small>おせわにっき</small></a><div class="tools"><button id="sound" class="tiny" aria-pressed="false">♪ OFF</button><button id="dev" class="tiny">DEV</button></div></header><main id="app"></main><footer>BABY YUURA <span>♡</span> きみのおせわで、どんなゆうらに？</footer></div><dialog id="devDialog"><div class="dialog-head"><h2>DEV / TEST</h2><button id="closeDev" class="tiny">閉じる</button></div><div id="devInfo"></div><p class="dev-note">強制結果・即進化は開発テスト用です。</p><div class="dev-actions"><button data-force="PERFECT">強制 PERFECT → 次へ</button><button data-force="CLEAR">強制 CLEAR → 次へ</button><button data-force="MISS">強制 MISS → 次へ</button><button id="devEvolution">現在の得点で即進化</button><label>判定テスト点数 <input id="testScore" type="number" min="0" max="12" value="10"></label><button id="previewEvolution">指定点数で進化をプレビュー</button><button id="reset">ベビ期をリセット</button></div></dialog></body></html>
